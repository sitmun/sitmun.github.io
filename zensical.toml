# Current SITMUN version, shown in the announcement bar (overrides/main.html).
[project.extra]
sitmun_version = "1.3.0"
# No "Made with Zensical" line: the footer shows only the copyright text below (in Spanish).
generator = false

# With --strict, the build fails on links to missing pages or anchors.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
# Template overrides: the announcement bar with the current version.
custom_dir = "overrides"
# classic keeps the Material for MkDocs look (and docs/css/extra.css).
variant = "classic"
# Fonts are self-hosted (docs/css/fonts.css); nothing is loaded from Google Fonts.
font = false
# Logo and favicon are copies of the SITMUN isotype (originals in docs/que-es-sitmun/red-sitmun/identidad/).
logo = "assets/images/sitmun-isotipo-28.png"
favicon = "assets/images/sitmun-isotipo-28.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]
language = "es"

[project.theme.palette]
primary = "black"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
info = "octicons/browser-16"

# search, autorefs and redirects are built into Zensical.
[project.plugins.search]

[project.plugins.autorefs]

[project.plugins.redirects]

[project.plugins.redirects.redirect_maps]
