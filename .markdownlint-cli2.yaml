# Markdown lint for the documentation (https://github.com/DavidAnson/markdownlint-cli2).
# Same version as DavidAnson/markdownlint-cli2-action@v25 in CI.
# Run locally: npx markdownlint-cli2@0.24.0
# Fix what can be fixed automatically: npx markdownlint-cli2@0.24.0 --fix
globs:
  - "docs/**/*.md"
  - "README.md"
ignores:
  - "_archive/**"
config:
  default: true
  # Prose is written one sentence (or one idea) per line; long lines are fine.
  MD013: false
  # Raw HTML is used on purpose (tables with layout, sized images, iframes).
  MD033: false
  # Python-Markdown (used by Zensical) needs 4-space indentation for nested lists.
  MD007:
    indent: 4
  # Indented content inside admonitions and content tabs looks like an
  # indented code block to markdownlint; fenced blocks are still the rule.
  MD046: false
  # Cross-page references such as [texto][api-de-autenticacion] are resolved
  # by the autorefs plugin built into Zensical, not by link definitions in the page.
  MD052: false
  # Bold lines are used as small captions inside tabs and steps.
  MD036: false
  # The same subheading (e.g. "Funcionalidades") under different sections is fine.
  MD024:
    siblings_only: true
  # Anchors are generated by Zensical (accents removed by the toc slugify), so
  # markdownlint's own slugs differ; `zensical build --strict` with the
  # [project.validation] in zensical.toml already checks anchors.
  MD051: false
  # Not auto-fixable safely. markdownlint treats content inside tabs and
  # admonitions as code, so MD053 would delete link definitions that are in
  # use there (and break the --strict build).
  MD053: false
  # Leave tabs inside code blocks alone (e.g. Makefiles, TSV): changing them
  # would change the example.
  MD010:
    code_blocks: false
