# Weekly check of the sitmun/sitmun issues cited in the docs' "SITMUN 1.3.0" notes.
# It gates nothing; a failed run means an issue was closed and its note needs updating.
name: Check issue notes

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-notes:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: List cited issues that are closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_issue_notes.py docs
