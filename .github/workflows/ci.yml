# Builds the site with Zensical (zensical.toml) and deploys it to GitHub Pages.
name: Deploy the site with GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Builds (without deploying) pull requests targeting the default branch
  pull_request:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default. Only the deploy job, which never runs on pull
# requests, gets the Pages and OIDC permissions it needs.
permissions:
  contents: read

# Allow one concurrent run per ref, so PR builds never cancel a deployment
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail before building if requirements.txt has drifted from poetry.lock
  requirements-sync:
    uses: ./.github/workflows/requirements-sync.yml

  # Build job
  build:
    needs: requirements-sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read      # actions/configure-pages reads the Pages settings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # check_old_urls.py reads the whole master history
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install Zensical and other requirements
        run: pip install -r requirements.txt
      - name: Build site (site_dir in zensical.toml is _site)
        # --strict does not fail on a malformed grid table (it renders as raw text), so fail on that message.
        run: |
          zensical build --strict --clean --config-file ./zensical.toml 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "Error rendering grid table" build.log; then
            echo "::error::A grid table does not render; check the row widths against its borders."
            exit 1
          fi
      # Zensical writes the redirect pages from a built-in English template.
      - name: Translate the redirect pages into Spanish
        run: python .github/scripts/localize_redirects.py zensical.toml _site
      # PlantUML diagrams come from a remote server; when it fails, the build still
      # succeeds with an error in place of the diagram. Fail instead.
      - name: Check that every PlantUML diagram rendered
        run: python .github/scripts/check_diagrams.py docs _site
      # Every page ever published from master must still resolve (page or redirect).
      - name: Check that old page URLs still resolve
        run: python .github/scripts/check_old_urls.py _site origin/master
      # A link inside the site must not land on a redirect stub: the linking text may be stale.
      - name: Check that no page links to a redirect stub
        run: python .github/scripts/check_redirect_links.py _site
      # Readers' browsers must make no third-party requests.
      - name: Check that pages load no resources from other hosts
        run: python .github/scripts/check_external_resources.py _site sitmun.github.io
      # Bold UI labels must exist in the documented SITMUN version (or be allowlisted).
      - name: Check UI labels against the documented SITMUN version
        run: python .github/scripts/check_ui_labels.py docs/usuario

      - name: Check that every known-bug note points to its issue
        run: python .github/scripts/check_bug_notes.py docs
      # --strict checks links written in the Markdown sources; lychee also checks the
      # generated HTML (theme and template links, such as the announcement bar).
      # External links are checked weekly by links.yml so a flaky site can't block a deploy.
      - name: Check local links in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" './_site/**/*.html'
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write     # to deploy to Pages
      id-token: write  # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1