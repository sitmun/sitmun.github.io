# Cogido de <https://gaseri.org/en/blog/2022-11-01-publishing-material-for-mkdocs-website-to-github-pages-using-custom-actions-workflow/>
name: Deploy the site with GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Builds (without deploying) pull requests targeting the default branch
  pull_request:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent run per ref, so PR builds never cancel a deployment
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail before building if requirements.txt has drifted from poetry.lock
  requirements-sync:
    uses: ./.github/workflows/requirements-sync.yml

  # Build job
  build:
    needs: requirements-sync
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install Zensical and other requirements
        run: pip install -r requirements.txt
      - name: Build site (site_dir in mkdocs.yml is _site)
        run: zensical build --strict --clean --config-file ./mkdocs.yml
      # zensical --strict can't see raw HTML (<img src>, <a href>); check every local link in the output.
      # External links are checked weekly by links.yml so a flaky site can't block a deploy.
      - name: Check local links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" './_site/**/*.html'
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
