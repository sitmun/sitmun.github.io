# Weekly check of every link in the built site, external ones included.
# It gates nothing; a failed run shows up in the Actions tab and notifies maintainers.
name: Check external links

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install MkDocs and other requirements
        run: pip install -r requirements.txt
      - name: Build site
        run: zensical build --strict --clean --config-file ./zensical.toml
      - name: Check that every PlantUML diagram rendered
        run: python .github/scripts/check_diagrams.py docs _site
      - name: Check all links in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --root-dir "${{ github.workspace }}/_site" './_site/**/*.html'
