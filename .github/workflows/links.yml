# Weekly check of every link in the built site, external ones included.
# It gates nothing; a failed run shows up in the Actions tab and notifies maintainers.
name: Check external links

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install MkDocs and other requirements
        run: pip install -r requirements.txt
      - name: Build site
        run: zensical build --strict --clean --config-file ./zensical.toml
      - name: Check that every PlantUML diagram rendered
        run: python .github/scripts/check_diagrams.py docs _site
      - name: Check all links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --root-dir "${{ github.workspace }}/_site" './_site/**/*.html'
