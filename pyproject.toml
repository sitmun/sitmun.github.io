[tool.poetry]
name = "sitmun-github-io"
version = "1.3.0"
description = "Documentación de SITMUN 3"
authors = ["Equipo de coordinación técnica"]
readme = "README.md"

[tool.poetry.dependencies]
# Only the packages the site uses directly. Their own dependencies
# (requests, urllib3, certifi, jinja2, pyyaml...) come from poetry.lock.
python = ">=3.11.5,<4.0"
markdown = "^3.11.3"
markdown-grid-tables = "^0.6.0"
# MkDocs 2.0 drops the plugin system that Material and every plugin below use.
mkdocs = ">=1.6.1,<2.0"
mkdocs-autorefs = "^1.4.5"
mkdocs-material = "^9.8.2"
mkdocs-print-site-plugin = "^2.9"
# 1.2.3 is published by the ProperDocs fork and pulls in the `properdocs`
# package; stay on 1.2.2 until moving to ProperDocs is a deliberate choice.
mkdocs-redirects = "1.2.2"
mkdocs-render-swagger-plugin = "^0.1.2"
plantuml-markdown = "^3.11.6"
pygments = "^2.21.0"
pymdown-extensions = "^13.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
