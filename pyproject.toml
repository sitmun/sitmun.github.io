[tool.poetry]
name = "sitmun-github-io"
version = "1.3.0"
description = "Documentación de SITMUN 3"
authors = ["Equipo de coordinación técnica"]
readme = "README.md"

[tool.poetry.dependencies]
# Only the packages the site uses directly. Their own dependencies
# (Markdown, pymdown-extensions, Pygments, Jinja2, PyYAML...) come from poetry.lock.
python = ">=3.11.5,<4.0"
# Zensical builds the site from mkdocs.yml; search, autorefs and redirects
# are built in.
zensical = "^0.1.2"
# Python-Markdown extensions enabled in mkdocs.yml
plantuml-markdown = "^3.11.6"
markdown-grid-tables = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
